name: Atualiza lista TV+

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gera lista M3U
        run: python -m src.generate_m3u

      - name: Commit & push se houver mudança
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualiza lista M3U"
          file_pattern: "data/*.json TVplus.m3u"
