name: Atualiza lista TV+

on:
  schedule:
    - cron: '0 */6 * * *'   # a cada 6 h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Executa atualização
        run: python src/generate_m3u.py

      - name: Commit & push se houver mudança
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Atualiza lista M3U"
          file_pattern: "data/*.json *.m3u"
